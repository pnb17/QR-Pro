<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Mobile Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>QRForge – Free QR Code Generator</title>

    <meta
      name="description"
      content="Create free QR codes for websites, WhatsApp, Wi-Fi, email, phone, SMS, location and contacts with QRForge."
    />

    <meta
      name="keywords"
      content="QR code generator, free QR code generator, QR code maker, QRForge, WhatsApp QR code, WiFi QR code, website QR code, email QR code, phone QR code"
    />

    <meta name="author" content="QRForge" />

    <!-- Search Engines -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://qrforge.in/" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#2563eb" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="QRForge – Free QR Code Generator"
    />

    <meta
      property="og:description"
      content="Create free QR codes for websites, WhatsApp, Wi-Fi, email, phone, SMS, location and contacts."
    />

    <meta
      property="og:url"
      content="https://qrforge.in/"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />

    <meta
      name="twitter:title"
      content="QRForge – Free QR Code Generator"
    />

    <meta
      name="twitter:description"
      content="Create free QR codes quickly and easily with QRForge."
    />

    <!-- Web App Information -->
    <meta
      name="application-name"
      content="QRForge"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "QRForge",
        "url": "https://qrforge.in/",
        "description": "Free QR code generator for websites, WhatsApp, Wi-Fi, email, phone, SMS, location and contacts.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Web Browser",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        }
      }
    </script>
  </head>

  <body>
    <div id="app"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
